services:
  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=*****
    ports:
      - 0000:00
    networks:
      - your_common_network
    depends_on: []
    dns:
      - 0.0.0.0
      - 0.0.0.0
    
networks:
  your_common_network:
    driver: bridge